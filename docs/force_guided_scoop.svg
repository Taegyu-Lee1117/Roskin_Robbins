<circle cx="1800" cy="470" r="70" fill="#FFFFFF" stroke="#146A5D" stroke-width="3"/>
<text x="1800" y="442.0" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="48" font-weight="750" text-anchor="middle" dominant-baseline="text-before-edge" fill="#146A5D">04</text>
<circle cx="2310" cy="470" r="70" fill="#FFFFFF" stroke="#146A5D" stroke-width="3"/>
<text x="2310" y="442.0" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="48" font-weight="750" text-anchor="middle" dominant-baseline="text-before-edge" fill="#146A5D">05</text>
