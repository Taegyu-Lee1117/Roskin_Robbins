<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1780" viewBox="0 0 2600 1780" role="img" aria-labelledby="title desc">
<title id="title">힘 기반 스쿠핑 상태 전이</title><desc id="desc">접촉 탐색, 추가 진입, 수직화와 CURL, 벽 접근, 후퇴와 상승의 상태 전이와 진입 판정 및 힘 제한을 설명한다.</desc>
<rect width="2600" height="1780" fill="#FFFFFF"/>
<text x="105" y="60.0" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="26" font-weight="650" text-anchor="start" dominant-baseline="text-before-edge" fill="#146A5D">SCOOP CONTROL  /  DR_BASE</text>
<text x="105" y="122.0" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="72" font-weight="800" text-anchor="start" dominant-baseline="text-before-edge" fill="#1C2C29">접촉에서 안전 이탈까지</text>
<text x="108" y="225.0" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge" fill="#52645C">현재 TCP를 기준으로 다음 동작을 만들고, 각 이동 단계 완료 후 힘을 확인</text>
<polyline points="348,470 652,470" fill="none" stroke="#146A5D" stroke-width="3"/>
