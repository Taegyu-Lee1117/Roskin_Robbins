<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1240" viewBox="0 0 2400 1240" role="img" aria-labelledby="title desc">
<title id="title">12단계 제조 공정</title><desc id="desc">정상 제조 흐름을 초기화부터 홈 복귀까지 12개 동작으로 묶어 표현한 공정도. 6번의 힘 기반 스쿠핑은 별도 상세도로 연결한다.</desc>
<rect width="2400" height="1240" fill="white"/>
<text x="64" y="54.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="52" font-weight="700" fill="#172A36" text-anchor="start" dominant-baseline="text-before-edge">12단계 제조 공정</text>
<text x="66" y="132.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="28" font-weight="400" fill="#657484" text-anchor="start" dominant-baseline="text-before-edge">주문 1건의 정상 실행 흐름 · 6번 스쿠핑의 접촉·진입·CURL·후퇴는 상세도에서 확인</text>
<rect x="1860" y="55" width="472" height="106" rx="12" fill="#EAF2FB" stroke="#EAF2FB" stroke-width="2"/>
